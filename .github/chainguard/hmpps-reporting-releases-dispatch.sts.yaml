# Caller is helm_app_release.yml on hmpps-reporting-releases branch DHS-987.
# This file must be on MI UI main. gh workflow run --ref selects DHS-704-tag-test.
# Before production, change DHS-987 to main and set event_name to push.
issuer: https://token.actions.githubusercontent.com
subject: repo:ministryofjustice/hmpps-reporting-releases:ref:refs/heads/DHS-987
claim_pattern:
  job_workflow_ref: '^ministryofjustice/hmpps-reporting-releases/\.github/workflows/helm_app_release\.yml@refs/heads/DHS-987$'
  event_name: '^(workflow_dispatch|push)$'
permissions:
  actions: write
  contents: read
