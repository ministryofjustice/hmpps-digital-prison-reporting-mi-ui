name: Scheduled security scans

# Node stack: CodeQL + npm.
# Veracode is omitted until security_veracode_* proxies support a Node
# artifact build (current proxies always call gradle_verify).

on:
  workflow_dispatch:
    inputs:
      scan:
        description: Which scan to run
        type: choice
        default: all
        options:
          - all
          - codeql
          - npm
          - prune-images
      prune-dry-run:
        description: prune-images only — list what would be deleted without deleting
        type: boolean
        default: true
  schedule:
    - cron: "19 6 * * MON-FRI"
    - cron: "41 6 * * 1" # prune-images, every Monday

jobs:
  codeql:
    name: Project security CodeQL actions scan
    if: |
      github.event.schedule == '19 6 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","codeql"]'), inputs.scan))
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/security_codeql_actions.yml@v1
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit

  npm:
    name: Project security npm dependency check
    if: |
      github.event.schedule == '19 6 * * MON-FRI' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","npm"]'), inputs.scan))
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/security_npm_dependency.yml@v1
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit

  prune-images:
    name: Prune old feature-build images (GHCR)
    if: |
      github.event.schedule == '41 6 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.scan == 'prune-images')
    permissions:
      packages: write
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/prune_images.yml@test/tag-based-releases
    with:
      older-than-days: 30
      # Scheduled runs stay dry-run until the listed versions have been
      # reviewed; then change to: ${{ github.event_name == 'workflow_dispatch' && inputs.prune-dry-run }}
      dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.prune-dry-run }}
