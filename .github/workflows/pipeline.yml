name: Pipeline

# TEST BRANCH ONLY (DHS-704-tag-test) — DO NOT MERGE.
# Exercises tag-based releases from hmpps-reporting-workflows@test/tag-based-releases.
# deploy-ref = this branch so the release tag is created; every environment is
# redirected to dev (no GitHub Environment here has approval gates).

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # release tag push (enable-release-tag)
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/frontend_node_pipeline.yml@test/tag-based-releases
    secrets: inherit
    with:
      deploy-ref: refs/heads/DHS-704-tag-test
      enable-release-tag: true
      primary-test-env: dev
      primary-preprod-env: dev
      primary-prod-env: dev
      enable-probation: false
      enable-sentry: true
      sentry-secret-name: hmpps-digital-prison-reporting-mi-ui-sentry
      node-version: '24'
      slack-channel: 'dpr_cicd_approvals'
