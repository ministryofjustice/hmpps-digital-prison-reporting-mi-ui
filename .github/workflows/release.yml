name: Release

# Helm-only release of an app release tag (vX.Y.Z, created by pipeline.yml on
# main builds). Triggered on main manually or by digital-prison-reporting-releases.
# Deploys image :vX.Y.Z with the Helm chart + values checked out at the tag.

on:
  # TEST BRANCH ONLY: push trigger just registers this workflow so it can be
  # dispatched before release.yml exists on main (job is skipped on push).
  push:
    branches: [DHS-704-tag-test]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match a GitHub Environment)
        type: choice
        options:
          - preprod
          - prod
          - test
          - dev
        required: true
      release-tag:
        description: App release tag (e.g. v1.0.3)
        type: string
        required: true
      release-values-yaml:
        description: Optional extra Helm values YAML (from releases config/)
        type: string
        required: false
        default: ''
      verify-image:
        description: Verify GHCR image exists before deploy
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/generic_release_pipeline.yml@test/tag-based-releases
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      release-tag: ${{ inputs.release-tag }}
      # Defaults: chart/release = repo name (hmpps-digital-prison-reporting-mi-ui)
      release-values-yaml: ${{ inputs.release-values-yaml }}
      verify-image: ${{ inputs.verify-image == true || inputs.verify-image == 'true' }}
      slack-notification: ${{ inputs.environment == 'prod' && 'true' || 'false' }}
      slack-channel: 'dpr_cicd_approvals'
      enable-sentry: true
      sentry-secret-name: hmpps-digital-prison-reporting-mi-ui-sentry
